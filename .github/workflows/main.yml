name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v2.7.2"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  BUILD_CONFIG: Release

jobs:
  build:
    name: Package source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package source
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="KBEngine-Nex-${VERSION}-source"
          mkdir -p dist
          tar -czf "dist/${PKG}.tar.gz" \
            --exclude='.git' --exclude='kbe/src/build' \
            --exclude='kbe/src/vcpkg_installed' \
            .
          echo "archive=dist/${PKG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_name=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "KBEngine-Nex $VERSION" \
              --notes "Release binaries for Windows, macOS, and Linux."
          fi

  publish-gitcode:
    name: Publish GitCode Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      GITCODE_OWNER: KBEngineLab
      GITCODE_REPO: KBEngine-Nex
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

    steps:
      - name: Check GitCode token
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "GITCODE_TOKEN not configured, skipping GitCode publish"
            exit 0
          fi

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push tag to GitCode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          git remote add gitcode "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"

          # Create tag locally if needed (workflow_dispatch doesn't have it yet)
          if ! git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            git tag "${VERSION}" -m "Release ${VERSION}"
          fi

          # Mirror all refs to gitcode
          git push gitcode --all --force
          git push gitcode --tags --force

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create release on GitCode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}/releases?access_token=${GITCODE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"KBEngine-Nex ${VERSION}\",\"body\":\"Release binaries for Windows, macOS, and Linux.\",\"release_status\":\"latest\"}")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')

          echo "Create release: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "Release created"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "Release already exists, continuing"
          else
            echo "Failed: $BODY"
            exit 1
          fi

      - name: Upload assets to GitCode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          for f in dist/*; do
            fname=$(basename "$f")
            echo "::group::Uploading $fname"

            UPLOAD_INFO=$(curl -sS \
              "https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}/releases/${VERSION}/upload_url?access_token=${GITCODE_TOKEN}&file_name=${fname}")

            UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.url')
            if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
              echo "Failed to get upload URL: $UPLOAD_INFO"
              exit 1
            fi

            # Build curl -H args
            HDR_ARGS=""
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              HDR_ARGS="$HDR_ARGS -H \"$line\""
            done < <(echo "$UPLOAD_INFO" | jq -r '.headers | to_entries[] | "\(.key): \(.value)"')

            upload_with_retry() {
              local retry=0 max=3
              while [ $retry -lt $max ]; do
                echo "Upload $fname (attempt $((retry+1))), size=$(stat -c%s "$f") bytes..."
                echo "URL: $(echo "$UPLOAD_URL" | cut -d'?' -f1)..."
                local http_code
                # -v stderr shows connection progress, -w stdout gives HTTP code
                http_code=$(eval "curl --connect-timeout 30 --max-time 600 -v -w '%{http_code}' -o /dev/null -X PUT \"$UPLOAD_URL\" $HDR_ARGS --data-binary @\"$f\"")
                echo "HTTP $http_code"
                if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "204" ]; then
                  return 0
                fi
                # Show error response (body was discarded, -v already showed headers)
                case "$http_code" in
                  5*) sleep 5; retry=$((retry+1)) ;;
                  *) return 1 ;;
                esac
              done
              return 1
            }

            upload_with_retry || exit 1
            echo "::endgroup::"
          done
