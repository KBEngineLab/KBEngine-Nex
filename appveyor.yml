shallow_clone: true

branches:
  only:
    - master
    - appveyor

os:
  - Visual Studio 2022
  # - Ubuntu2204 #Build execution time has reached the maximum allowed time for your plan (60 minutes).

environment:
  matrix:
    - TOOLSET: vs2022

# 自定义构建步骤
build_script:
  - cmd: if "%APPVEYOR_BUILD_WORKER_IMAGE%"=="Visual Studio 2022" call install\install_windows.bat
  - sh: if [ "$APPVEYOR_BUILD_WORKER_IMAGE" = "Ubuntu2204" ]; then bash install/install_linux.sh; fi

